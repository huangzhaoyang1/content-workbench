name: CI

# 推 main 与任何 PR 都跑一遍：后端 pytest + 前端类型检查与单元测试。
on:
  push:
    branches: [main]
  pull_request:

# 只读权限即可；同一分支的新提交会取消上一次未跑完的任务，省额度。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # requirements.txt 里的 OCR 依赖（paddlepaddle / paddleocr）在 3.11 上
      # 会被真实安装，体积较大；首次跑得慢，之后命中 pip 缓存会快很多。
      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行后端测试
        run: python -m pytest backend -q

  frontend:
    name: 前端类型检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 运行前端测试
        run: npm run test
