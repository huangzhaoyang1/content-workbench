[pytest]
# 让项目根目录在 sys.path 上，从而可以 `import backend...`
pythonpath = ..
testpaths = backend/tests
norecursedirs = _archive_junk node_modules .git
# 硬排除根目录的 _archive_junk（旧迁移临时测试，会被 pytest 自动发现干扰）
addopts = -q --ignore=_archive_junk --ignore=backend/_archive_junk
filterwarnings =
    ignore::DeprecationWarning
